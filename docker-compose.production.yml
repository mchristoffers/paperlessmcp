name: paperlessmcp

# PaperlessMCP auf der Homeserver-Coolify. Oeffentlich erreichbar (fuer den
# claude.ai Web-Connector) ueber den Homelab-Cloudflare-Tunnel, gesichert
# durch oauth-agents (siehe unten). PaperlessMCP selbst haengt direkt im
# internen Docker-Netz der bestehenden paperless-App.
#
# Vorher standen hier Dex + oauth2-proxy + ein Caddy-Router. Dex kann kein
# Dynamic Client Registration, weshalb claude.ai beim Verbinden immer nach
# einer Client-ID gefragt hat. Jetzt zwei Container statt drei; /register
# liefert immer denselben statischen Client, egal wer wie oft fragt.
# Quelle: github.com/mchristoffers/oauth-agents — hier einkopiert, damit der
# Coolify-Deploy nicht von einem zweiten privaten Repo abhaengt.
#
# PAPERLESS_BASE_URL zeigt bewusst auf den echten externen Hostnamen
# (https://paperless.mchristoffers.dev), nicht auf http://paperless:8000: alle
# Download-/Vorschau-/Thumbnail-URLs, die PaperlessMCP zurueckgibt, werden
# clientseitig aus genau dieser Base-URL gebaut (siehe DocumentTools.cs,
# client.BaseUrl) und muessen deshalb direkt im Browser/Tailnet anklickbar
# sein. `paperless-alias` macht den Hostnamen intern aufloesbar und leitet auf
# Port 443 (Standardport, keine Extrawurst in den zurueckgegebenen URLs) an
# den bestehenden paperless-proxy (Caddy) weiter, der die echte TLS-Terminierung
# fuer diese Domain haelt — kein Aendern der bestehenden paperless-App noetig.

services:
  paperlessmcp:
    image: ghcr.io/barryw/paperlessmcp:${PAPERLESSMCP_VERSION:-latest}
    # Ohne pull_policy zieht `up -d` nur, wenn das Image lokal fehlt — auf einem
    # wandernden `latest` liefe sonst ewig der zuerst gezogene Stand weiter.
    pull_policy: always
    restart: unless-stopped
    depends_on:
      paperless-alias:
        condition: service_started
    environment:
      PAPERLESS_BASE_URL: https://paperless.mchristoffers.dev
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN:?PAPERLESS_API_TOKEN is required}
    expose:
      - "5000"
    networks:
      - paperless_internal
    volumes:
      - paperlessmcp_outbox:/home/mcp/outbox

  # Reiner TCP-Durchreicher: macht paperless.mchristoffers.dev innerhalb des
  # Docker-Netzes auf dem Standardport 443 auflösbar/erreichbar, ohne die
  # bestehende paperless-App anzufassen. TLS terminiert weiterhin bei
  # paperless-proxy (Caddy) mit dessen echtem Let's-Encrypt-Zertifikat — hier
  # werden nur verschlüsselte Bytes durchgereicht, nichts wird entschlüsselt.
  paperless-alias:
    image: alpine/socat:latest
    restart: unless-stopped
    command: ["TCP-LISTEN:443,fork,reuseaddr", "TCP:paperless-proxy:8443"]
    networks:
      paperless_internal:
        aliases:
          - paperless.mchristoffers.dev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Port 443 ist privilegiert; ohne dieses eine Capability scheitert der bind.
      - NET_BIND_SERVICE

  # OAuth 2.1 (Authorization Code + PKCE) in ~300 Zeilen Python, ohne
  # Abhaengigkeiten und ohne Datenbank. Tokens sind zustandslose JWTs, mit
  # JWT_SECRET signiert — ein Redeploy wirft deshalb keine Logins weg (Dex mit
  # storage:memory hat genau das getan). Access-Token 1h, Refresh 30 Tage.
  # Die Coolify-Variablen heissen GATEWAY_*/OAUTH_*, der Dienst erwartet
  # USERNAME/PASSWORD/CLIENT_SECRET — deshalb hier umgehaengt.
  auth:
    build:
      context: ./auth
      pull: true
    restart: unless-stopped
    environment:
      ISSUER: ${ISSUER:?ISSUER is required}
      RESOURCE: ${ISSUER:?ISSUER is required}/mcp
      USERNAME: ${GATEWAY_USERNAME:?GATEWAY_USERNAME is required}
      PASSWORD: ${GATEWAY_PASSWORD:?GATEWAY_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:?OAUTH_CLIENT_SECRET is required}
      CLIENT_ID: claude-mcp
      REDIRECT_URIS: https://claude.ai/api/mcp/auth_callback,https://chatgpt.com/connector/oauth/NaeyNdNYffGn
    expose:
      - "8000"
    networks:
      - paperless_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Plain-HTTP-Proxy hinter dem Homelab-Cloudflare-Tunnel (der terminiert TLS).
  # Login-Endpunkte gehen an auth, alles andere braucht ein gueltiges Token
  # (auth_request) und geht dann an das unveraenderte PaperlessMCP.
  proxy:
    build:
      context: ./proxy
      pull: true
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_started
      paperlessmcp:
        condition: service_started
    environment:
      UPSTREAM: http://paperlessmcp:5000
      NGINX_ENVSUBST_FILTER: "^UPSTREAM$$"
    ports:
      - "8084:8080"
    networks:
      - paperless_internal

volumes:
  paperlessmcp_outbox:

networks:
  # Das interne Netz der bestehenden paperless-Coolify-App (nicht dieser App).
  # So spricht PaperlessMCP Paperless direkt ueber dessen Servicenamen an,
  # ohne Caddy/Tailscale/oeffentliches DNS fuer reinen API-Traffic zu bemuehen.
  paperless_internal:
    external: true
    name: nft6hzc8en3d17anjht3vm1f_app_internal
