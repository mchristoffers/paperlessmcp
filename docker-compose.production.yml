name: paperlessmcp

# PaperlessMCP auf der Homeserver-Coolify. Oeffentlich erreichbar (fuer den
# claude.ai Web-Connector) ueber den Homelab-Cloudflare-Tunnel, gesichert
# durch Dex + oauth2-proxy (siehe unten). Kein Tailscale-Pfad mehr — der
# fruehere `svc:paperlessmcp`/Caddy-Sidecar-Weg ist entfernt, seit alles nur
# noch ueber den oeffentlichen OAuth-Pfad laeuft. PaperlessMCP selbst haengt
# direkt im internen Docker-Netz der bestehenden paperless-App.
#
# PAPERLESS_BASE_URL zeigt bewusst auf den echten externen Hostnamen
# (https://paperless.mchristoffers.dev), nicht auf http://paperless:8000: alle
# Download-/Vorschau-/Thumbnail-URLs, die PaperlessMCP zurueckgibt, werden
# clientseitig aus genau dieser Base-URL gebaut (siehe DocumentTools.cs,
# client.BaseUrl) und muessen deshalb direkt im Browser/Tailnet anklickbar
# sein. `paperless-alias` macht den Hostnamen intern aufloesbar und leitet auf
# Port 443 (Standardport, keine Extrawurst in den zurueckgegebenen URLs) an
# den bestehenden paperless-proxy (Caddy) weiter, der die echte TLS-Terminierung
# fuer diese Domain haelt — kein Aendern der bestehenden paperless-App noetig.

services:
  paperlessmcp:
    image: ghcr.io/barryw/paperlessmcp:${PAPERLESSMCP_VERSION:-latest}
    # Ohne pull_policy zieht `up -d` nur, wenn das Image lokal fehlt — auf einem
    # wandernden `latest` liefe sonst ewig der zuerst gezogene Stand weiter.
    pull_policy: always
    restart: unless-stopped
    depends_on:
      paperless-alias:
        condition: service_started
    environment:
      PAPERLESS_BASE_URL: https://paperless.mchristoffers.dev
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN:?PAPERLESS_API_TOKEN is required}
    expose:
      - "5000"
    networks:
      - paperless_internal
    volumes:
      - paperlessmcp_outbox:/home/mcp/outbox

  # Reiner TCP-Durchreicher: macht paperless.mchristoffers.dev innerhalb des
  # Docker-Netzes auf dem Standardport 443 auflösbar/erreichbar, ohne die
  # bestehende paperless-App anzufassen. TLS terminiert weiterhin bei
  # paperless-proxy (Caddy) mit dessen echtem Let's-Encrypt-Zertifikat — hier
  # werden nur verschlüsselte Bytes durchgereicht, nichts wird entschlüsselt.
  paperless-alias:
    image: alpine/socat:latest
    restart: unless-stopped
    command: ["TCP-LISTEN:443,fork,reuseaddr", "TCP:paperless-proxy:8443"]
    networks:
      paperless_internal:
        aliases:
          - paperless.mchristoffers.dev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Port 443 ist privilegiert; ohne dieses eine Capability scheitert der bind.
      - NET_BIND_SERVICE

  # Oeffentlicher Zugriff fuer claude.ai (Web-Connector kann nicht ins
  # Tailnet). Kein Cloudflare Access, kein Google-Login: Dex ist ein
  # premade, 11k*-OIDC-Server mit rein statischer Konfiguration — genau ein
  # Client (claude-mcp), genau ein lokaler Nutzer (moritz). Speicher: memory
  # (kein Datenbestand, nur kurzlebige Auth-Codes/Sessions).
  dex:
    build:
      context: ./dex
      pull: true
    restart: unless-stopped
    environment:
      DEX_CLIENT_SECRET: ${DEX_CLIENT_SECRET:?DEX_CLIENT_SECRET is required}
    expose:
      - "5556"
    networks:
      - paperless_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Premade Bearer-Token-Gate (14.8k*) vor dem unveraenderten paperlessmcp:
  # prueft den von claude.ai gesendeten JWT gegen Dex' JWKS
  # (skip-jwt-bearer-tokens-Modus, kein Cookie/Redirect-Flow noetig) und
  # reicht dann durch.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    restart: unless-stopped
    depends_on:
      paperlessmcp:
        condition: service_started
      dex:
        condition: service_started
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://paperlessmcp-oauth.mchristoffers.dev/dex
      OAUTH2_PROXY_CLIENT_ID: claude-mcp
      OAUTH2_PROXY_CLIENT_SECRET: ${DEX_CLIENT_SECRET:?DEX_CLIENT_SECRET is required}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?OAUTH2_PROXY_COOKIE_SECRET is required}
      OAUTH2_PROXY_REDIRECT_URL: https://paperlessmcp-oauth.mchristoffers.dev/oauth2/callback
      OAUTH2_PROXY_UPSTREAMS: http://paperlessmcp:5000
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS: "true"
      OAUTH2_PROXY_EXTRA_JWT_ISSUERS: https://paperlessmcp-oauth.mchristoffers.dev/dex=claude-mcp
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "true"
    expose:
      - "4180"
    networks:
      - paperless_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Plain-HTTP-Router hinter dem Homelab-Cloudflare-Tunnel (Tunnel terminiert
  # TLS, siehe coolify-home/nextcloud/appflowy/mealie). Routet /dex/* zu Dex,
  # /mcp* zum Bearer-Gate, und serviert die MCP-Protected-Resource-Metadata
  # als statisches JSON (keine eigene Logik, nur Caddy-Config).
  paperlessmcp-oauth-router:
    build:
      context: ./router
      pull: true
    restart: unless-stopped
    depends_on:
      dex:
        condition: service_started
      oauth2-proxy:
        condition: service_started
    ports:
      - "8084:8080"
    networks:
      - paperless_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  paperlessmcp_outbox:

networks:
  # Das interne Netz der bestehenden paperless-Coolify-App (nicht dieser App).
  # So spricht PaperlessMCP Paperless direkt ueber dessen Servicenamen an,
  # ohne Caddy/Tailscale/oeffentliches DNS fuer reinen API-Traffic zu bemuehen.
  paperless_internal:
    external: true
    name: nft6hzc8en3d17anjht3vm1f_app_internal
