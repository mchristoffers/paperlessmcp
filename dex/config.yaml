issuer: https://paperlessmcp-oauth.mchristoffers.dev/dex

storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

staticClients:
  - id: claude-mcp
    secretEnv: DEX_CLIENT_SECRET
    redirectURIs:
      - https://claude.ai/api/mcp/auth_callback
      - https://chatgpt.com/connector/oauth/NaeyNdNYffGn
    name: "Claude PaperlessMCP"

enablePasswordDB: true
staticPasswords:
  # NOT A REAL HASH — intentionally invalid placeholder. Login will fail
  # until Moritz generates a real bcrypt hash and sets it here (or better,
  # templates it in from an env var at deploy time, like DEX_CLIENT_SECRET).
  - email: "moritz"
    hash: "REPLACE_WITH_REAL_BCRYPT_HASH_BEFORE_DEPLOY"
    username: "moritz"
    userID: "moritz"
