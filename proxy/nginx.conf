# The whole routing story: the login endpoints go to the auth service,
# everything else needs a valid token and is passed to UPSTREAM.
# ${...} values come from .env, substituted at container start.

server {
    listen 8080;
    server_name _;

    client_max_body_size 100m;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_buffering off;

    # Login flow — public, it cannot require a login itself.
    location = /register      { proxy_pass http://auth:8000/register; }
    location = /authorize     { proxy_pass http://auth:8000/authorize; }
    location = /token         { proxy_pass http://auth:8000/token; }
    location ^~ /.well-known/ { proxy_pass http://auth:8000; }

    location = /_verify {
        internal;
        proxy_pass http://auth:8000/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # Everything else: valid token required, then straight to the upstream.
    location / {
        auth_request /_verify;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @unauthorized;

        proxy_pass ${UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-User $auth_user;
        # The client's token is for this proxy, not for the upstream.
        proxy_set_header Authorization "";
    }

    # The auth service's 401 already carries WWW-Authenticate and nginx copies
    # it from the subrequest; only the body is added here.
    location @unauthorized {
        default_type application/json;
        return 401 '{"error":"unauthorized"}';
    }
}
